services:
  postgres:
    image: postgres:16
    container_name: screenhive_db
    environment:
      POSTGRES_USER: screenhive
      POSTGRES_PASSWORD: screenhive_password
      POSTGRES_DB: screenhive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenhive -d screenhive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: screenhive_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: screenhive_api
    environment:
      DATABASE_URL: postgresql+psycopg://screenhive:screenhive_password@postgres:5432/screenhive
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: screenhive-docker-secret
      FIRESTORE_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: