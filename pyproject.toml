[project]
name = "screenhive"
version = "0.1.0"
description = "Cinema seat booking backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

