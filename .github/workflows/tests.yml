name: ScreenHive Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: screenhive
          POSTGRES_PASSWORD: screenhive_password
          POSTGRES_DB: screenhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U screenhive -d screenhive"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://screenhive:screenhive_password@localhost:5432/screenhive
          JWT_SECRET: test-secret
        run: uv run pytest 
