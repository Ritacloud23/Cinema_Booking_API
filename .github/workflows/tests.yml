name: ScreenHive Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: screenhive
          POSTGRES_PASSWORD: screenhive_password
          POSTGRES_DB: screenhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U screenhive -d screenhive"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Create test database
        env:
          PGPASSWORD: screenhive_password
        run: |
          psql -h localhost -U screenhive -d screenhive -c "CREATE DATABASE screenhive_test;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://screenhive:screenhive_password@localhost:5432/screenhive
          JWT_SECRET: test-secret
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest